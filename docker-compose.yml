services:
  bene-rh:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_INDEXABLE: "true"
        NEXT_PUBLIC_CALENDLY_URL: "https://calendly.com/parcerias-amandastamboni/30min"
    container_name: bene-rh
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BENE_DATA_DIR: /data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - bene-rh-data:/data

volumes:
  bene-rh-data:
