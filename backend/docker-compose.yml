# API do diagnóstico + MySQL.
# Uso:  cp .env.example .env  (ajuste as senhas)  &&  docker compose up -d --build
#
# O site chama POST https://benerh.com.br/diagnostico. Os labels do Traefik abaixo
# mandam só esse caminho para a API; o resto do domínio continua no serviço do site.
services:
  mysql:
    image: mysql:8.4
    container_name: bene-diagnostico-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: benerh
      MYSQL_USER: ${DB_USER:-benerh}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
    volumes:
      - bene-diagnostico-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USER:-benerh}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  diagnostico-api:
    container_name: bene-diagnostico-api
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/benerh?serverTimezone=UTC
      DB_USER: ${DB_USER:-benerh}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://benerh.com.br,https://www.benerh.com.br}
    networks:
      - internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.benerh-diagnostico.rule=Host(`benerh.com.br`) && PathPrefix(`/diagnostico`)
      - traefik.http.routers.benerh-diagnostico.priority=100
      - traefik.http.routers.benerh-diagnostico.entrypoints=web,websecure
      - traefik.http.routers.benerh-diagnostico.tls.certresolver=myresolver
      - traefik.http.routers.benerh-diagnostico.tls=true
      - traefik.http.services.benerh-diagnostico.loadbalancer.server.port=8080

volumes:
  bene-diagnostico-mysql:

networks:
  internal:
  traefik-public:
    external: true
