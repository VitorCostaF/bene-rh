server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: diagnostico-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/benerh?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:benerh}
    password: ${DB_PASSWORD:benerh}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # As migrations rodam no serviço "flyway" do docker-compose, não ao subir a aplicação.
    # Para rodar em desenvolvimento local: FLYWAY_ENABLED=true
    enabled: ${FLYWAY_ENABLED:false}

app:
  cors:
    # Em produção o site chama /diagnostico na mesma origem; isto só vale para outros domínios/dev.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://benerh.com.br,https://www.benerh.com.br,http://localhost:3000}
